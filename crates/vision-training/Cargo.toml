[package]
name = "vision-training"
# Deliberately NOT `version.workspace = true`. This crate's version is the ABI
# contract the training server pins against (`vision_training.__version__`).
# 0.2.0 is the LabelMe converter's encoding parameter: both `convert_labelme_*`
# pyfunctions changed arity and return type, so a 0.1.x `.so` must be refused
# rather than called. Bump it whenever a pyfunction signature changes.
version = "0.2.0"
edition.workspace = true
authors.workspace = true
description = "Rust optimizations for training-server (PyO3)"

[lib]
name = "vision_training"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `abi3-py310` builds against CPython's *stable* ABI, so ONE wheel
# (`...-cp310-abi3-...whl`) imports on 3.10 (the training server) and on 3.13
# (dev boxes) alike, instead of one wheel per interpreter -- installing the
# wrong one used to give `ModuleNotFoundError` next to a wheel that visibly
# "was there".
#
# It does NOT change the module's contract, only how the `.so` links, so the
# crate version (== `file_service.REQUIRED_RUST_ABI`) deliberately stays 0.2.0.
#
# Declared here and not in `[workspace.dependencies]` on purpose: the workspace
# entry documents why `extension-module` must stay off (it breaks `cargo test`),
# and abi3 is this crate's concern alone -- `shared` has no pyo3 dependency.
pyo3 = { workspace = true, features = ["abi3-py310"] }
numpy = { workspace = true }
shared = { workspace = true }

ndarray = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

image = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

walkdir = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]
