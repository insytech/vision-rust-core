[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "vision-training"
# Must track crates/vision-training/Cargo.toml -- the training server pins
# `vision_training.__version__` (which comes from the Cargo version) as an ABI
# check, and a wheel whose filename disagrees with its `__version__` is a trap.
version = "0.2.0"
description = "Rust optimizations for training-server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Insytech Vision Team" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy>=1.24,<2.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "vision_training"
